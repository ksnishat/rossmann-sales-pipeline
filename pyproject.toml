[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "rossmann-sales-pipeline"
version = "1.0.0"
description = "End-to-end MLOps system for retail sales forecasting with Random Forest"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Khaled Saifullah", email = "ksnishaat@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "streamlit>=1.30.0",
    "dash>=2.14.0",
    "dash-bootstrap-components>=1.6.0",
    "plotly>=5.18.0",
    "mlflow>=2.7.1",
    "psycopg2-binary>=2.9.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "prometheus-client>=0.20.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
rossmann-api = "src.app.api:app"
rossmann-dashboard = "src.dash_app.app:app"
rossmann-train = "src.scripts.train_model:train"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Notebooks re-import the same names in each cell, which is normal in Jupyter
# but trips F811. They are not linted.
extend-exclude = ["notebooks", ".ipynb_checkpoints"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
# B008: FastAPI requires File(...)/Depends(...) in argument defaults.
# C408: dict() calls in Dash layout definitions are intentional.
# UP045: the Airflow image runs Python 3.8, where PEP 604 unions
# (str | None) raise TypeError at runtime, so Optional[...] is required.
ignore = ["E501", "B008", "C408", "UP045"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: requires the live docker stack (set LIVE_STACK=1)",
]