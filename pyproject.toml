[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rossmann-sales-pipeline"
version = "1.0.0"
description = "End-to-end MLOps system for retail sales forecasting with Random Forest"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Khaled Saifullah", email = "ksnishaat@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "streamlit>=1.30.0",
    "dash>=2.14.0",
    "dash-bootstrap-components>=1.6.0",
    "plotly>=5.18.0",
    "mlflow>=2.7.1",
    "psycopg2-binary>=2.9.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "prometheus-client>=0.20.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "slowapi==0.1.10",
    "tenacity>=9.0,<10.0",
    "python-json-logger>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
rossmann-api = "src.app.api:app"
rossmann-dashboard = "src.dash_app.app:app"
rossmann-train = "src.scripts.train_model:train"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Notebooks re-import the same names in each cell, which is normal in Jupyter
# but trips F811. They are not linted.
extend-exclude = ["notebooks", ".ipynb_checkpoints"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
# B008: FastAPI requires File(...)/Depends(...) in argument defaults.
# C408: dict() calls in Dash layout definitions are intentional.
# UP045: the Airflow image runs Python 3.8, where PEP 604 unions
# (str | None) raise TypeError at runtime, so Optional[...] is required.
ignore = ["E501", "B008", "C408", "UP045"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: requires the live docker stack (set LIVE_STACK=1)",
]

# --- uv -------------------------------------------------------------------
# uv is the resolver and installer for this project. `uv sync` installs the
# locked set; `uv lock` regenerates it. The CPU wheel index is declared here
# because PEP 508 has no syntax for an index URL, which is why the serving
# image previously needed a separate requirements-serve.txt.
[tool.uv]
# The default PyPI index plus the CPU-only torch wheels. `unsafe-best-match`
# lets uv consider both indexes for the same package, which is required for
# torch: PyPI carries the CUDA build, the pytorch index carries +cpu.
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = false

[tool.uv.sources]
# Pin torch and torchvision to the CPU index so a serving install never pulls
# the 3.2 GB of nvidia wheels that the default PyPI build drags in.
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
