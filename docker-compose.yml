version: '3.8'

services:
  # ==========================================
  # 1. DATABASE (PostgreSQL)
  # ==========================================
  postgres:
    image: postgres:15
    container_name: rossmann_postgres
    environment:
      - POSTGRES_USER=rossmann
      - POSTGRES_PASSWORD=changeme123
      - POSTGRES_DB=rossmann
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rossmann"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - rossmann-network

  # ==========================================
  # 2. MLflow (Experiment Tracking)
  # ==========================================
  mlflow:
    container_name: rossmann_mlflow
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.mlflow
    ports:
      - "5000:5000"
    environment:
      - BACKEND_STORE_URI=postgresql://rossmann:changeme123@postgres:5432/rossmann
      - DEFAULT_ARTIFACT_ROOT=s3://mlflow/
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "mlflow server --backend-store-uri postgresql://rossmann:changeme123@postgres:5432/rossmann --default-artifact-root s3://mlflow/ --host 0.0.0.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - rossmann-network

  # ==========================================
  # 3. MinIO (S3 Compatible Storage)
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: rossmann_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - rossmann-network

  # ==========================================
  # 4. BACKEND (FastAPI)
  # ==========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: rossmann_api
    command: uvicorn src.app.api:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./src:/app/src
    environment:
      - DATABASE_URL=postgresql://rossmann:changeme123@postgres:5432/rossmann
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - rossmann-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ==========================================
  # 5. DASHBOARD (Plotly Dash - Modern Enterprise UI)
  # ==========================================
  dash:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rossmann_dash
    command: python -m src.dash_app.app
    ports:
      - "8050:8050"
    volumes:
      - ./src:/app/src
    environment:
      - API_URL=http://api:8000/predict
      - DASH_PORT=8050
      - DASH_DEBUG=false
      - PYTHONUNBUFFERED=1
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8050/_dash-health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - rossmann-network

  # ==========================================
  # 6. LEGACY FRONTEND (Streamlit)
  # ==========================================
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rossmann_streamlit
    command: streamlit run src/app/dashboard.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src
    environment:
      - API_URL=http://api:8000/predict
      - PYTHONUNBUFFERED=1
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - rossmann-network

  # ==========================================
  # 7. MONITORING (Prometheus + Grafana)
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: rossmann_prometheus
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - rossmann-network

  grafana:
    image: grafana/grafana:latest
    container_name: rossmann_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=rossmann
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - rossmann-network

networks:
  rossmann-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data: