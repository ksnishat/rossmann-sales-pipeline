apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rossmann.fullname" . }}-api
  labels:
    app: {{ include "rossmann.fullname" . }}
    component: api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "rossmann.fullname" . }}
      component: api
  template:
    metadata:
      labels:
        app: {{ include "rossmann.fullname" . }}
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "rossmann.fullname" . }}-config
            - secretRef:
                name: {{ include "rossmann.fullname" . }}-secrets
          env:
            - name: DATABASE_URL
              value: "postgresql://rossmann:changeme@postgres:5432/rossmann"
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /openapi.json
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10