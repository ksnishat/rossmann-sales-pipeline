replicaCount: 3

image:
  repository: ghcr.io/ksnishat/rossmann-sales-pipeline
  pullPolicy: IfNotPresent
  tag: latest

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: nginx
  host: rossmann.example.com
  tls: true

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2
    memory: 2Gi

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilization: 70
  targetMemoryUtilization: 80

env:
  APP_NAME: rossmann
  APP_ENV: production
  APP_LOG_LEVEL: INFO
  POSTGRES_USER: rossmann
  POSTGRES_DB: rossmann
  DASH_PORT: "8050"

# The serve image bakes the trained weights into /app/models. Mounting an
# empty PVC over that path hides them and the API starts with no model, so
# persistence is off by default. Enable it only when you supply weights
# through the volume instead of the image.
persistence:
  enabled: false
  size: 20Gi
  accessMode: ReadWriteOnce

dash:
  # Off by default: the dashboard needs dash and plotly, which
  # requirements-serve.txt excludes to keep the API image small, so it needs
  # its own image. Enable it only after publishing that image, otherwise the
  # pod sits in ErrImagePull and `helm install --wait` times out.
  enabled: false
  image:
    repository: ghcr.io/ksnishat/rossmann-sales-pipeline-dashboard
    tag: latest
  port: 8050
  replicas: 1